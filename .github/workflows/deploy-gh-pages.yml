name: Deploy docs to GitHub Pages (with PR previews)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy site on push to main
        if: github.event_name == 'push'
        run: |
          echo "Publishing docs/ to gh-pages branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Create a temporary branch with docs content and push to gh-pages (root)
          rm -rf site || true
          mkdir site
          cp -r docs/* site/ || true
          cd site
          git init
          git add .
          git commit -m "Deploy docs to gh-pages (push)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:gh-pages

      - name: Create PR preview (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_NUM: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing preview for PR #${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # clone gh-pages or create it if missing
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO} gh-pages
          else
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO} gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initialize gh-pages"
            git push origin gh-pages
            cd ..
            git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO} gh-pages
          fi
          rsync -a docs/ gh-pages/pr-${PR_NUM}/
          cd gh-pages
          git add .
          git commit -m "Preview: update PR #${PR_NUM}" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO} gh-pages
          echo "Preview available at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${PR_NUM}/"
          # Post a comment to the PR with preview link
          gh pr comment $PR_NUM --body "Preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${PR_NUM}/" || true
