name: Build, push to ECR and deploy to ECS (Fargate)

on:
  push:
    branches: [ main ]
    paths:
      - 'week9/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image and push to ECR
        id: build-image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
          FULL_NAME=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker build -t ${FULL_NAME} week9
          docker push ${FULL_NAME}
          echo "image=${FULL_NAME}" >> $GITHUB_OUTPUT

      - name: Update ECS service to use new image
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
          TASK_DEF_TEMPLATE: .github/aws/ecs-task-def.json
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Registering new task definition based on template"
          IMAGE=${{ steps.build-image.outputs.image }}
          # Replace placeholder in template with built image
          jq --arg img "${IMAGE}" '.containerDefinitions[0].image = $img' ${TASK_DEF_TEMPLATE} > taskdef.json
          aws ecs register-task-definition --cli-input-json file://taskdef.json > register-output.json
          REVISION=$(jq -r '.taskDefinition.taskDefinitionArn' register-output.json)
          echo "Registered: ${REVISION}"
          aws ecs update-service --cluster ${CLUSTER} --service ${SERVICE} --force-new-deployment

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL}" ]; then
            echo "No HEALTHCHECK_URL provided; skipping HTTP check"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl --fail ${HEALTHCHECK_URL}; then
              echo "Healthcheck passed"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed"
          exit 1
