name: Week13 Experiment Lab CI

on:
  push:
    branches:
      - main
      - chore/week13-experiment
    paths:
      - 'week13/**'
      - '.github/workflows/week13-experiment.yml'
  pull_request:
    paths:
      - 'week13/**'
      - '.github/workflows/week13-experiment.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: week13/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week13-coverage
          path: week13/coverage/
          retention-days: 14

  weekly-report:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: week13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: week13/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly report artifact
        run: npm run report

      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: week13-weekly-report
          path: |
            week13/reports/weekly-report.md
            week13/reports/experiment-summary.json
          retention-days: 14

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: week13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: week13/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: week13-playwright-artifacts
          path: |
            week13/test-results/
            week13/playwright-report/
          retention-days: 14