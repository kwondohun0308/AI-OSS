name: Publish week9 NPM package
on:
  push:
    branches:
      - main
    paths:
      - 'week9/**'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com/
      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@${{ github.repository_owner }}:registry=https://npm.pkg.github.com/" >> ~/.npmrc
      - name: Bump patch version
        id: bump
        run: |
          cd week9
          npm version patch --no-git-tag-version
          echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - name: Commit and tag release version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week9/package.json week9/package-lock.json
          git commit -m "chore(release): week9 v${VERSION}" || echo "no changes to commit"
          git tag "week9-v${VERSION}"
          git push
          git push --tags
      - name: Publish bumped package
        working-directory: week9
        run: |
          npm install
          npm publish --registry=https://npm.pkg.github.com/ --access=public
